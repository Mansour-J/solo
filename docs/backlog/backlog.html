<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Solo backlog</title>
    <!--
      Solo's backlog: the items that deliver the roadmap, with status, priority and acceptance criteria.
      An item's status lives only here. Open this file in a browser to filter, group and read items.

      THE DATA is the JSON block with id="backlog-data" near the end of this file. Edit only that block
      (one object per item), then run `npm run backlog -- check`. How to add and update items:
      .claude/skills/backlog/SKILL.md. The page below the data never needs to change for new items.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: light-dark(#f7f7f5, #141517);
        --panel: light-dark(#ffffff, #1c1d20);
        --panel-2: light-dark(#f1f1ee, #232428);
        --border: light-dark(#e2e2dd, #2f3035);
        --text: light-dark(#1d1e20, #e8e8ea);
        --muted: light-dark(#6b6d72, #9a9ca3);
        --accent: light-dark(#1c64d6, #6ea6ff);
        --accent-soft: light-dark(#e6efff, #1d2a42);
        --focus: light-dark(#1c64d6, #8db8ff);
        --shadow: light-dark(0 8px 30px rgb(0 0 0 / 0.12), 0 8px 30px rgb(0 0 0 / 0.5));

        --s-idea: light-dark(#8a8d93, #8f9299);
        --s-ready: light-dark(#1c64d6, #5f9bff);
        --s-in-progress: light-dark(#c77700, #f0a43a);
        --s-in-review: light-dark(#7b4fd6, #a988ff);
        --s-blocked: light-dark(#cc2f2f, #ff6b6b);
        --s-parked: light-dark(#8a6a4a, #c19d78);
        --s-done: light-dark(#23894a, #4cc27a);
        --s-dropped: light-dark(#b9bbc0, #55575d);

        --radius: 10px;
        --mono: ui-monospace, 'SF Mono', Consolas, 'Cascadia Mono', monospace;
        font-family:
          Inter,
          'Segoe UI',
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 15px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--text);
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      code,
      .id {
        font-variant-ligatures: none;
      }
      code {
        font-family: var(--mono);
        font-size: 0.86em;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0 0.3em;
        overflow-wrap: anywhere;
      }
      a {
        color: var(--accent);
      }
      [hidden] {
        display: none !important;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      /* Header */
      header.top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
      }
      .top-inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 12px 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 16px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-right: auto;
      }
      .brand h1 {
        font-size: 1.2rem;
        margin: 0;
      }
      .brand span {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .search {
        position: relative;
        flex: 1 1 260px;
        max-width: 420px;
      }
      .search input {
        width: 100%;
        padding: 8px 12px 8px 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel);
      }
      .search svg {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .search kbd {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 5px;
      }
      .tabs {
        display: inline-flex;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 2px;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--muted);
      }
      .tabs button[aria-pressed='true'] {
        background: var(--panel);
        color: var(--text);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
      }
      .icon-btn {
        white-space: nowrap;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 8px;
        padding: 6px 9px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* Layout */
      .layout {
        max-width: 1400px;
        margin: 0 auto;
        padding: 16px 20px 60px;
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 20px;
        align-items: start;
      }
      aside.filters {
        position: sticky;
        top: 76px;
        max-height: calc(100vh - 92px);
        overflow: auto;
        padding-right: 4px;
      }
      .filters-toggle {
        display: none;
      }
      .facet {
        margin-bottom: 16px;
      }
      .facet h2 {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 6px;
        display: flex;
        justify-content: space-between;
      }
      .facet h2 button {
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
        font-size: 0.72rem;
        text-transform: none;
        letter-spacing: 0;
        padding: 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: 999px;
        padding: 3px 10px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .chip {
        text-align: left;
      }
      .chip .n {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-size: 0.78rem;
      }
      .chip[aria-pressed='true'] {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .chip[data-empty='true'] {
        opacity: 0.45;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
        background: var(--c, var(--muted));
      }
      .switch {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
        cursor: pointer;
        margin-bottom: 8px;
      }
      .controls {
        display: grid;
        gap: 8px;
      }
      .controls label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
      }
      .controls select {
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
      }
      .reset {
        width: 100%;
        margin-top: 4px;
        justify-content: center;
      }

      /* Summary */
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }
      .stat {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 14px;
      }
      .stat b {
        display: block;
        font-size: 1.5rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      .stat span {
        color: var(--muted);
        font-size: 0.82rem;
      }
      .sections-bars {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        margin-bottom: 14px;
      }
      .sections-bars h2 {
        font-size: 0.9rem;
        margin: 0 0 8px;
      }
      .sbar {
        display: grid;
        grid-template-columns: minmax(120px, 230px) 1fr 70px;
        gap: 10px;
        align-items: center;
        width: 100%;
        border: 0;
        background: none;
        padding: 4px 6px;
        border-radius: 6px;
        cursor: pointer;
        text-align: left;
      }
      .sbar:hover {
        background: var(--panel-2);
      }
      .sbar[aria-pressed='true'] {
        background: var(--accent-soft);
      }
      .sbar .label {
        font-size: 0.88rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sbar .count {
        text-align: right;
        font-size: 0.8rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .stack {
        display: flex;
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
        background: var(--panel-2);
        gap: 1px;
      }
      .stack i {
        display: block;
        background: var(--c);
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        margin-top: 8px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      /* List */
      .result-line {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 4px 2px 10px;
      }
      .group {
        margin-bottom: 18px;
      }
      .group-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 2px 6px;
      }
      .group-head h2 {
        font-size: 1rem;
        margin: 0;
      }
      .group-head .n {
        color: var(--muted);
        font-size: 0.82rem;
      }
      .group-intro {
        color: var(--muted);
        font-size: 0.86rem;
        margin: -2px 2px 8px;
        max-width: 80ch;
      }
      .rows {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .row {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        width: 100%;
        text-align: left;
        border: 0;
        border-top: 1px solid var(--border);
        background: none;
        padding: 9px 14px;
        cursor: pointer;
      }
      .row:first-child {
        border-top: 0;
      }
      .row:hover {
        background: var(--panel-2);
      }
      .row[aria-current='true'] {
        background: var(--accent-soft);
      }
      .row.dropped .title {
        text-decoration: line-through;
        color: var(--muted);
      }
      .id {
        font-family: var(--mono);
        font-size: 0.82rem;
        color: var(--muted);
      }
      .title {
        font-weight: 500;
        min-width: 0;
      }
      .title small {
        display: block;
        font-weight: 400;
        color: var(--muted);
        font-size: 0.8rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.76rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 1px 7px;
        white-space: nowrap;
        background: var(--panel);
      }
      .badge.status {
        border-color: color-mix(in srgb, var(--c) 45%, transparent);
        background: color-mix(in srgb, var(--c) 12%, var(--panel));
      }
      .badge.p0 {
        border-color: var(--s-blocked);
        color: var(--s-blocked);
        font-weight: 600;
      }
      .badge.p1 {
        font-weight: 600;
      }
      .badge.label {
        border-style: dashed;
      }
      .progress {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 0.76rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .progress .bar {
        width: 38px;
        height: 5px;
        border-radius: 3px;
        background: var(--panel-2);
        overflow: hidden;
      }
      .progress .bar i {
        display: block;
        height: 100%;
        background: var(--s-done);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 20px;
        background: var(--panel);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
      }

      /* Board */
      .board {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(230px, 1fr);
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .col {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px;
        min-height: 120px;
      }
      .col h2 {
        font-size: 0.85rem;
        margin: 2px 4px 8px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .col h2 .n {
        color: var(--muted);
        font-weight: 400;
      }
      .card {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 3px solid var(--c);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 7px;
        cursor: pointer;
      }
      .card:hover {
        box-shadow: var(--shadow);
      }
      .card .title {
        display: block;
        font-size: 0.9rem;
        margin: 2px 0 6px;
      }
      .card .meta {
        justify-content: flex-start;
      }

      /* Guide */
      .guide {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 24px 20px;
        max-width: 900px;
      }
      .guide h2 {
        font-size: 1.05rem;
        margin: 22px 0 8px;
      }
      .guide table {
        border-collapse: collapse;
        width: 100%;
        font-size: 0.9rem;
      }
      .guide th,
      .guide td {
        text-align: left;
        border-bottom: 1px solid var(--border);
        padding: 6px 8px;
        vertical-align: top;
      }
      .guide th {
        color: var(--muted);
        font-weight: 500;
      }
      .guide pre {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
        font-size: 0.82rem;
      }

      /* Detail drawer */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgb(0 0 0 / 0.3);
        z-index: 20;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(640px, 100vw);
        background: var(--panel);
        border-left: 1px solid var(--border);
        box-shadow: var(--shadow);
        z-index: 21;
        display: flex;
        flex-direction: column;
      }
      .drawer[hidden],
      .scrim[hidden] {
        display: none;
      }
      .drawer-head {
        padding: 14px 18px 12px;
        border-bottom: 1px solid var(--border);
      }
      .drawer-nav {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
      }
      .drawer-nav .id {
        margin-right: auto;
        font-size: 0.9rem;
      }
      .drawer h2 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        line-height: 1.3;
      }
      .drawer-body {
        padding: 6px 18px 30px;
        overflow: auto;
      }
      .drawer h3 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 18px 0 6px;
      }
      .drawer p {
        margin: 0 0 8px;
      }
      .status-note {
        margin-top: 8px;
        font-size: 0.88rem;
        color: var(--muted);
      }
      ul.criteria {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      ul.criteria li {
        display: grid;
        grid-template-columns: 22px 1fr;
        gap: 6px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      ul.criteria li:last-child {
        border-bottom: 0;
      }
      .tick {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 1.5px solid var(--muted);
        display: grid;
        place-items: center;
        margin-top: 2px;
        font-size: 12px;
        color: #fff;
      }
      .tick.on {
        background: var(--s-done);
        border-color: var(--s-done);
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .link-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        border-radius: 8px;
        padding: 4px 9px;
        cursor: pointer;
        font-size: 0.84rem;
        text-align: left;
      }
      a.sl {
        font-family: var(--mono);
        font-size: 0.9em;
      }

      .layout.wide {
        grid-template-columns: minmax(0, 1fr);
      }
      .layout.wide aside.filters {
        display: none;
      }
      @media (max-width: 860px) {
        header.top {
          position: static;
        }
        .summary {
          grid-template-columns: repeat(3, 1fr);
          gap: 6px;
        }
        .stat {
          padding: 6px 10px;
        }
        .stat b {
          font-size: 1.2rem;
        }
        .stat span {
          font-size: 0.75rem;
        }
        .drawer-nav {
          flex-wrap: wrap;
        }
        .drawer-nav .id {
          flex-basis: 100%;
          order: 5;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        aside.filters {
          position: static;
          max-height: none;
          display: none;
        }
        aside.filters.open {
          display: block;
        }
        .filters-toggle {
          display: inline-flex;
        }
        .row {
          grid-template-columns: 56px minmax(0, 1fr);
        }
        .row .meta {
          grid-column: 2;
          justify-content: flex-start;
        }
        .sbar {
          grid-template-columns: 1fr 90px;
        }
        .sbar .stack {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        .brand span {
          display: none;
        }
        .search kbd {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <h1>Solo backlog</h1>
          <span>Items that deliver the roadmap · status lives only here</span>
        </div>
        <label class="search">
          <span class="visually-hidden">Search items</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input id="q" type="search" placeholder="Search IDs, titles, criteria, code…" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <div class="tabs" role="group" aria-label="View">
          <button type="button" data-view="list">List</button>
          <button type="button" data-view="board">Board</button>
          <button type="button" data-view="guide">Guide</button>
        </div>
        <button type="button" class="icon-btn filters-toggle" id="filters-toggle" aria-expanded="false">Filters</button>
        <button type="button" class="icon-btn" id="theme" title="Switch light or dark">◐</button>
      </div>
    </header>

    <div class="layout" id="layout">
      <aside class="filters" id="filters" aria-label="Filters"></aside>
      <main id="main"></main>
    </div>

    <div class="scrim" id="scrim" hidden></div>
    <section class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></section>

    <!-- BACKLOG DATA: edit here (see the comment at the top of this file). -->
    <script type="application/json" id="backlog-data">
      {
        "title": "Solo backlog",
        "guide": {
          "about": [
            "The work that delivers the [roadmap](../product/roadmap.md) and the [specification](../product/specification.md), as items with a status, priority and acceptance criteria. **An item’s status lives only here**; the roadmap gives the phase overview.",
            "IDs are `SL-<phase><two digits>` (phase 0 = foundation follow-ups). They are never reused; a new item takes the next free number in its section.",
            "**Definition of done** for every feature: [CONTRIBUTING.md](../../CONTRIBUTING.md) (UI, API, migration, validation on both sides, tenant isolation with a cross-tenant test, audit, states, light/dark/phone screenshots, an E2E journey, docs). No dead UI, no fake data."
          ],
          "editing": [
            "The data is the JSON block `<script type=\"application/json\" id=\"backlog-data\">` at the end of `docs/backlog/backlog.html`. Edit only that block: the page renders whatever it holds. The `backlog` skill (`.claude/skills/backlog/SKILL.md`) describes every field and the rules.",
            "Run `npm run backlog -- next <section>` for the next free ID, `npm run backlog -- show SL-123` to read an item, and `npm run backlog -- check` after every edit (it is part of `npm run check`).",

    </script>

    <script>
      (() => {
        'use strict';
        const DATA = JSON.parse(document.getElementById('backlog-data').textContent);
        const STATUS_KEYS = DATA.statuses.map((s) => s.name);
        const SECTION_BY_ID = new Map(DATA.sections.map((s) => [s.id, s]));
        const ITEM_BY_ID = new Map(DATA.items.map((i) => [i.id, i]));
        const CLOSED = new Set(['Done', 'Dropped']);
        // Inside a frame (the published copy) a copied URL wouldn't reopen the item, so there's no Copy link.
        const EMBEDDED = window.self !== window.top;
        const NEEDED_BY = new Map();
        for (const item of DATA.items)
          for (const dep of item.dependsOn) {
            if (!NEEDED_BY.has(dep)) NEEDED_BY.set(dep, []);
            NEEDED_BY.get(dep).push(item.id);
          }

        const FACETS = [
          { key: 'status', label: 'Status', values: STATUS_KEYS },
          { key: 'priority', label: 'Priority', values: DATA.priorities.map((p) => p.name) },
          { key: 'type', label: 'Type', values: DATA.types.map((t) => t.name) },
          { key: 'size', label: 'Size', values: DATA.sizes.map((s) => s.name) },
          { key: 'section', label: 'Phase', values: DATA.sections.map((s) => s.id) },
          { key: 'label', label: 'Label', values: (DATA.labels || []).map((l) => l.name) },
        ];
        /** Whether an item has a facet value (labels are a list; the rest one value each). */
        const hasValue = (item, key, value) => (key === 'label' ? (item.labels || []).includes(value) : item[key] === value);
        const GROUPS = { section: 'Phase', status: 'Status', priority: 'Priority', type: 'Type', size: 'Size', none: 'No grouping' };
        const SORTS = { id: 'ID', priority: 'Priority', status: 'Status', progress: 'Criteria left' };

        const state = {
          q: '',
          status: new Set(),
          priority: new Set(),
          type: new Set(),
          size: new Set(),
          section: new Set(),
          label: new Set(),
          open: false,
          group: 'section',
          sort: 'id',
          view: 'list',
          item: null,
        };

        // ---------- helpers ----------
        const $ = (sel) => document.querySelector(sel);
        const esc = (s) =>
          String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        const statusVar = (s) => `var(--s-${s.toLowerCase().replace(/\s+/g, '-')})`;
        const idNum = (id) => Number(id.slice(3));
        const sectionOrder = new Map(DATA.sections.map((s, i) => [s.id, i]));
        const sectionLabel = (id) => {
          const s = SECTION_BY_ID.get(id);
          return s ? (s.phase.includes('–') ? s.title : `Phase ${s.phase} · ${s.title}`) : id;
        };
        const shortSection = (id) => {
          const s = SECTION_BY_ID.get(id);
          return s ? (s.phase.includes('–') ? 'Foundation' : `Phase ${s.phase}`) : id;
        };
        const valueLabel = (key, v) => (key === 'section' ? sectionLabel(v) : v);

        /** Inline Markdown: `code`, [text](url), **bold**, *italic*, and SL-123 links. */
        function inline(text) {
          const parts = String(text).split(/(`[^`]*`)/g);
          return parts
            .map((part) => {
              if (part.startsWith('`') && part.endsWith('`') && part.length > 1) return `<code>${esc(part.slice(1, -1))}</code>`;
              let h = esc(part);
              h = h.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
                const external = /^https?:/.test(u);
                return `<a href="${u}"${external ? ' target="_blank" rel="noopener"' : ''}>${t}</a>`;
              });
              h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
              h = h.replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, '$1<em>$2</em>');
              h = h.replace(/(^|[^\w/#-])(SL-\d{3})\b/g, (m, pre, id) =>
                ITEM_BY_ID.has(id) ? `${pre}<a class="sl" href="#item=${id}" data-item="${id}">${id}</a>` : m,
              );
              return h;
            })
            .join('');
        }
        const paragraphs = (text) =>
          String(text || '')
            .split(/\n\s*\n/)
            .filter((p) => p.trim())
            .map((p) => `<p>${inline(p.trim())}</p>`)
            .join('');
        const plain = (text) =>
          String(text || '')
            .replace(/[`*]/g, '')
            .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');

        function criteriaProgress(item) {
          const total = item.criteria.length;
          const done = item.criteria.filter((c) => c.done).length;
          return { total, done };
        }

        // ---------- filtering ----------
        function haystack(item) {
          return [
            item.id,
            item.title,
            item.status,
            item.statusNote,
            item.type,
            item.priority,
            item.summary,
            item.code,
            item.notes,
            sectionLabel(item.section),
            ...item.criteria.map((c) => c.text),
            ...(item.labels || []),
            ...item.dependsOn,
          ]
            .join(' ')
            .toLowerCase();
        }
        const HAY = new Map(DATA.items.map((i) => [i.id, haystack(i)]));

        function matches(item, except) {
          if (state.open && CLOSED.has(item.status)) return false;
          for (const f of FACETS) {
            if (f.key === except) continue;
            const set = state[f.key];
            if (set.size && ![...set].some((v) => hasValue(item, f.key, v))) return false;
          }
          const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
          const hay = HAY.get(item.id);
          return terms.every((t) => hay.includes(t));
        }

        function compare(a, b) {
          const byId = sectionOrder.get(a.section) - sectionOrder.get(b.section) || idNum(a.id) - idNum(b.id);
          if (state.sort === 'priority') return a.priority.localeCompare(b.priority) || byId;
          if (state.sort === 'status') return STATUS_KEYS.indexOf(a.status) - STATUS_KEYS.indexOf(b.status) || byId;
          if (state.sort === 'progress') {
            const pa = criteriaProgress(a);
            const pb = criteriaProgress(b);
            return pb.total - pb.done - (pa.total - pa.done) || byId;
          }
          return byId;
        }

        const filtered = () => DATA.items.filter((i) => matches(i)).sort(compare);

        // ---------- URL state ----------
        function readHash() {
          const p = new URLSearchParams(location.hash.slice(1));
          state.q = p.get('q') || '';
          for (const f of FACETS) state[f.key] = new Set((p.get(f.key) || '').split(',').filter((v) => f.values.includes(v)));
          state.open = p.get('open') === '1';
          state.group = GROUPS[p.get('group')] ? p.get('group') : 'section';
          state.sort = SORTS[p.get('sort')] ? p.get('sort') : 'id';
          state.view = ['list', 'board', 'guide'].includes(p.get('view')) ? p.get('view') : 'list';
          state.item = ITEM_BY_ID.has(p.get('item')) ? p.get('item') : null;
        }
        function writeHash() {
          const p = new URLSearchParams();
          if (state.q) p.set('q', state.q);
          for (const f of FACETS) if (state[f.key].size) p.set(f.key, [...state[f.key]].join(','));
          if (state.open) p.set('open', '1');
          if (state.group !== 'section') p.set('group', state.group);
          if (state.sort !== 'id') p.set('sort', state.sort);
          if (state.view !== 'list') p.set('view', state.view);
          if (state.item) p.set('item', state.item);
          const next = p.toString().replace(/%2C/g, ',');
          if (location.hash.slice(1) === next) return;
          try {
            history.replaceState(null, '', next ? `#${next}` : location.pathname + location.search);
          } catch {
            /* a sandboxed frame (the published copy) may refuse history changes */
          }
        }

        // ---------- rendering ----------
        function badges(item, { section = false } = {}) {
          const { total, done } = criteriaProgress(item);
          const pct = total ? Math.round((done / total) * 100) : 0;
          return `
            <span class="badge status" style="--c:${statusVar(item.status)}"><span class="dot"></span>${esc(item.status)}</span>
            <span class="badge ${item.priority.toLowerCase()}" title="Priority">${item.priority}</span>
            <span class="badge" title="Type">${esc(item.type)}</span>
            <span class="badge" title="Size">${esc(item.size)}</span>
            ${section ? `<span class="badge" title="Phase">${esc(sectionLabel(item.section))}</span>` : ''}
            ${(item.labels || []).map((l) => `<span class="badge label" title="Label">${esc(l)}</span>`).join('')}
            ${
              total
                ? `<span class="progress" title="${done} of ${total} acceptance criteria met"><span class="bar"><i style="width:${pct}%"></i></span>${done}/${total}</span>`
                : ''
            }`;
        }

        function renderFilters() {
          const html = FACETS.map((f) => {
            const chips = f.values
              .map((v) => {
                const n = DATA.items.filter((i) => hasValue(i, f.key, v) && matches(i, f.key)).length;
                const on = state[f.key].has(v);
                const dot = f.key === 'status' ? `<span class="dot" style="--c:${statusVar(v)}"></span>` : '';
                const desc = describe(f.key, v);
                return `<button type="button" class="chip" data-facet="${f.key}" data-value="${esc(v)}" aria-pressed="${on}" data-empty="${n === 0 && !on}" ${desc ? `title="${esc(desc)}"` : ''}>${dot}${esc(valueLabel(f.key, v))}<span class="n">${n}</span></button>`;
              })
              .join('');
            const clear = state[f.key].size ? `<button type="button" data-clear="${f.key}">Clear</button>` : '';
            return `<div class="facet"><h2>${f.label}${clear}</h2><div class="chips">${chips}</div></div>`;
          }).join('');
          const opt = (obj, cur) =>
            Object.entries(obj)
              .map(([k, v]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${v}</option>`)
              .join('');
          $('#filters').innerHTML = `
            <div class="facet">
              <label class="switch"><input type="checkbox" id="open-only" ${state.open ? 'checked' : ''}/> Hide done and dropped</label>
              <div class="controls">
                <label>Group by <select id="group">${opt(GROUPS, state.group)}</select></label>
                <label>Sort by <select id="sort">${opt(SORTS, state.sort)}</select></label>
              </div>
            </div>
            ${html}
            <button type="button" class="icon-btn reset" id="reset">Reset filters</button>`;
        }

        function describe(key, value) {
          const list = { status: DATA.statuses, priority: DATA.priorities, type: DATA.types, size: DATA.sizes, label: DATA.labels }[key];
          return list ? (list.find((x) => x.name === value) || {}).description || '' : '';
        }

        function renderSummary(items) {
          const all = DATA.items;
          const count = (pred) => all.filter(pred).length;
          const stats = [
            [count((i) => !CLOSED.has(i.status) && i.status !== 'Parked'), 'open items'],
            [count((i) => i.status === 'Ready'), 'ready to start'],
            [count((i) => i.status === 'In progress' || i.status === 'In review'), 'in progress or review'],
            [count((i) => i.status === 'Blocked' || i.status === 'Parked'), 'blocked or parked'],
            [count((i) => i.status === 'Done'), 'done'],
          ];
          const bars = DATA.sections
            .map((s) => {
              const its = all.filter((i) => i.section === s.id);
              const done = its.filter((i) => i.status === 'Done').length;
              const segs = STATUS_KEYS.map((st) => {
                const n = its.filter((i) => i.status === st).length;
                return n ? `<i style="--c:${statusVar(st)};flex:${n}" title="${esc(st)}: ${n}"></i>` : '';
              }).join('');
              const on = state.section.size === 1 && state.section.has(s.id);
              return `<button type="button" class="sbar" data-section="${s.id}" aria-pressed="${on}" title="Show only this phase">
                <span class="label">${esc(sectionLabel(s.id))}</span>
                <span class="stack" role="img" aria-label="${STATUS_KEYS.map((st) => `${st} ${its.filter((i) => i.status === st).length}`).join(', ')}">${segs}</span>
                <span class="count">${done}/${its.length} done</span>
              </button>`;
            })
            .join('');
          const legend = STATUS_KEYS.map((st) => `<span><span class="dot" style="--c:${statusVar(st)}"></span>${esc(st)}</span>`).join('');
          return `
            <div class="summary">${stats.map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('')}</div>
            <div class="sections-bars"><h2>Progress by phase</h2>${bars}<div class="legend">${legend}</div></div>
            <div class="result-line" aria-live="polite">${items.length === all.length ? `All ${all.length} items` : `${items.length} of ${all.length} items match`}</div>`;
        }

        function groupItems(items) {
          if (state.group === 'none') return [{ key: 'all', title: 'All items', items }];
          const key = state.group;
          const order = key === 'section' ? DATA.sections.map((s) => s.id) : FACETS.find((f) => f.key === key).values;
          return order
            .map((k) => ({
              key: k,
              title: valueLabel(key, k),
              intro: key === 'section' ? SECTION_BY_ID.get(k).intro : describe(key, k),
              items: items.filter((i) => i[key] === k),
            }))
            .filter((g) => g.items.length);
        }

        function rowHtml(item) {
          const sub = plain(item.statusNote ? `${item.status}: ${item.statusNote}` : item.summary || (item.criteria[0] || {}).text || '');
          return `<button type="button" class="row ${item.status === 'Dropped' ? 'dropped' : ''}" data-item="${item.id}" aria-current="${state.item === item.id}">
            <span class="id">${item.id}</span>
            <span class="title">${inline(item.title)}${sub ? `<small>${esc(sub)}</small>` : ''}</span>
            <span class="meta">${badges(item, { section: state.group !== 'section' })}</span>
          </button>`;
        }

        function renderList(items) {
          if (!items.length)
            return `<div class="empty">No items match these filters. <button type="button" class="icon-btn" data-action="reset">Reset filters</button></div>`;
          return groupItems(items)
            .map(
              (g) => `<section class="group">
                <div class="group-head"><h2>${esc(g.title)}</h2><span class="n">${g.items.length} item${g.items.length === 1 ? '' : 's'}</span></div>
                ${g.intro ? (Array.isArray(g.intro) ? g.intro.map((p) => `<div class="group-intro">${inline(p)}</div>`).join('') : `<div class="group-intro">${esc(g.intro)}</div>`) : ''}
                <div class="rows">${g.items.map(rowHtml).join('')}</div>
              </section>`,
            )
            .join('');
        }

        function renderBoard(items) {
          const cols = STATUS_KEYS.filter((s) => !(state.open && CLOSED.has(s)) && (!state.status.size || state.status.has(s)));
          return `<div class="board">${cols
            .map((st) => {
              const its = items.filter((i) => i.status === st);
              return `<section class="col"><h2><span class="dot" style="--c:${statusVar(st)}"></span>${esc(st)} <span class="n">${its.length}</span></h2>
                ${its
                  .map(
                    (i) => `<button type="button" class="card" style="--c:${statusVar(st)}" data-item="${i.id}">
                      <span class="id">${i.id} · ${esc(shortSection(i.section))}</span>
                      <span class="title">${inline(i.title)}</span>
                      <span class="meta"><span class="badge ${i.priority.toLowerCase()}">${i.priority}</span><span class="badge">${esc(i.type)}</span><span class="badge">${esc(i.size)}</span>${
                        i.criteria.length ? `<span class="progress">${criteriaProgress(i).done}/${i.criteria.length}</span>` : ''
                      }</span>
                    </button>`,
                  )
                  .join('')}</section>`;
            })
            .join('')}</div>`;
        }

        function nextFreeId(section) {
          const nums = DATA.items.filter((i) => i.section === section.id).map((i) => idNum(i.id));
          const base = Number(section.idPrefix) * 100;
          const next = Math.max(base, ...nums) + 1;
          return `SL-${String(next).padStart(3, '0')}`;
        }

        function renderGuide() {
          const table = (rows, head) =>
            `<table><thead><tr>${head.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
          const g = DATA.guide;
          return `<article class="guide">
            <h2>How this backlog works</h2>
            ${g.about.map((p) => `<p>${inline(p)}</p>`).join('')}
            <h2>Status</h2>${table(
              DATA.statuses.map((s) => [
                `<span class="badge status" style="--c:${statusVar(s.name)}"><span class="dot"></span>${esc(s.name)}</span>`,
                inline(s.description),
              ]),
              ['Status', 'Meaning'],
            )}
            <h2>Type</h2>${table(
              DATA.types.map((t) => [esc(t.name), inline(t.description)]),
              ['Type', 'Meaning'],
            )}
            <h2>Priority</h2>${table(
              DATA.priorities.map((t) => [esc(t.name), inline(t.description)]),
              ['Priority', 'Meaning'],
            )}
            <h2>Size</h2>${table(
              DATA.sizes.map((t) => [esc(t.name), inline(t.description)]),
              ['Size', 'Meaning'],
            )}
            <h2>Phases and the next free ID</h2>${table(
              DATA.sections.map((s) => [esc(sectionLabel(s.id)), `<code>${esc(s.id)}</code>`, `<code>${nextFreeId(s)}</code>`]),
              ['Phase', 'Section id', 'Next free ID'],
            )}
            <h2>Adding or updating an item</h2>
            ${g.editing.map((p) => `<p>${inline(p)}</p>`).join('')}
            <pre>${esc(JSON.stringify(g.example, null, 2))}</pre>
          </article>`;
        }

        function renderDrawer() {
          const drawer = $('#drawer');
          const scrim = $('#scrim');
          const item = state.item && ITEM_BY_ID.get(state.item);
          if (!item) {
            drawer.hidden = true;
            scrim.hidden = true;
            return;
          }
          const list = filtered();
          const idx = list.findIndex((i) => i.id === item.id);
          const prev = idx > 0 ? list[idx - 1].id : null;
          const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1].id : null;
          const linkChip = (id) => {
            const it = ITEM_BY_ID.get(id);
            if (!it) return `<span class="link-chip">${esc(id)} (missing)</span>`;
            return `<button type="button" class="link-chip" data-item="${id}"><span class="dot" style="--c:${statusVar(it.status)}" title="${esc(it.status)}"></span><span class="id">${id}</span>${inline(it.title)}</button>`;
          };
          const neededBy = NEEDED_BY.get(item.id) || [];
          const { total, done } = criteriaProgress(item);
          drawer.innerHTML = `
            <div class="drawer-head">
              <div class="drawer-nav">
                <span class="id">${item.id} · ${esc(sectionLabel(item.section))}</span>
                <button type="button" class="icon-btn" data-nav="${prev || ''}" ${prev ? '' : 'disabled'} title="Previous (k)" aria-label="Previous item">↑</button>
                <button type="button" class="icon-btn" data-nav="${next || ''}" ${next ? '' : 'disabled'} title="Next (j)" aria-label="Next item">↓</button>
                ${EMBEDDED ? '' : '<button type="button" class="icon-btn" id="copy-link" title="Copy a link to this item">Copy link</button>'}
                <button type="button" class="icon-btn" id="close" title="Close (Esc)" aria-label="Close">✕</button>
              </div>
              <h2 id="drawer-title">${inline(item.title)}</h2>
              <div class="meta" style="justify-content:flex-start">${badges(item)}</div>
              ${item.statusNote ? `<div class="status-note">${esc(item.status)}: ${inline(item.statusNote)}</div>` : ''}
            </div>
            <div class="drawer-body">
              ${item.summary ? `<h3>Summary</h3>${paragraphs(item.summary)}` : ''}
              ${
                total
                  ? `<h3>Acceptance criteria · ${done} of ${total}</h3><ul class="criteria">${item.criteria
                      .map(
                        (c) =>
                          `<li><span class="tick ${c.done ? 'on' : ''}" aria-label="${c.done ? 'Met' : 'Not met'}">${c.done ? '✓' : ''}</span><span>${inline(c.text)}</span></li>`,
                      )
                      .join('')}</ul>`
                  : ''
              }
              ${item.code ? `<h3>Code</h3><p>${inline(item.code)}</p>` : ''}
              ${item.notes ? `<h3>Notes</h3>${paragraphs(item.notes)}` : ''}
              <h3>Depends on</h3>${item.dependsOn.length ? `<div class="links">${item.dependsOn.map(linkChip).join('')}</div>` : '<p class="status-note">Nothing</p>'}
              ${neededBy.length ? `<h3>Needed by</h3><div class="links">${neededBy.map(linkChip).join('')}</div>` : ''}
            </div>`;
          const wasHidden = drawer.hidden;
          drawer.hidden = false;
          scrim.hidden = false;
          if (wasHidden) $('#close').focus();
        }

        function render() {
          for (const b of document.querySelectorAll('[data-view]')) b.setAttribute('aria-pressed', String(b.dataset.view === state.view));
          if ($('#q').value !== state.q) $('#q').value = state.q;
          renderFilters();
          const items = filtered();
          const main = $('#main');
          $('#layout').classList.toggle('wide', state.view === 'guide');
          $('#filters-toggle').hidden = state.view === 'guide';
          if (state.view === 'guide') main.innerHTML = renderGuide();
          else main.innerHTML = renderSummary(items) + (state.view === 'board' ? renderBoard(items) : renderList(items));
          renderDrawer();
          writeHash();
        }

        function resetFilters() {
          state.q = '';
          for (const f of FACETS) state[f.key].clear();
          state.open = false;
          render();
        }

        // ---------- events ----------
        document.addEventListener('click', (e) => {
          const t = e.target.closest('button, a');
          if (!t) return;
          if (t.dataset.view) {
            state.view = t.dataset.view;
            return render();
          }
          if (t.dataset.facet) {
            const set = state[t.dataset.facet];
            set.has(t.dataset.value) ? set.delete(t.dataset.value) : set.add(t.dataset.value);
            return render();
          }
          if (t.dataset.clear) {
            state[t.dataset.clear].clear();
            return render();
          }
          if (t.dataset.section) {
            const on = state.section.size === 1 && state.section.has(t.dataset.section);
            state.section = on ? new Set() : new Set([t.dataset.section]);
            return render();
          }
          if (t.dataset.item) {
            e.preventDefault();
            state.item = t.dataset.item;
            return render();
          }
          if (t.dataset.nav) {
            state.item = t.dataset.nav;
            return render();
          }
          if (t.id === 'close') return closeDrawer();
          if (t.id === 'reset' || t.dataset.action === 'reset') return resetFilters();
          if (t.id === 'copy-link') {
            navigator.clipboard
              ?.writeText(location.href)
              .then(() => {
                t.textContent = 'Copied';
                setTimeout(() => (t.textContent = 'Copy link'), 1500);
              })
              .catch(() => {
                t.textContent = 'Copy failed';
              });
            return;
          }
          if (t.id === 'theme') {
            const root = document.documentElement;
            const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
            root.dataset.theme = dark ? 'light' : 'dark';
            try {
              localStorage.setItem('solo-backlog-theme', root.dataset.theme);
            } catch {
              /* storage unavailable on file:// in some browsers */
            }
            return;
          }
          if (t.id === 'filters-toggle') {
            const open = $('#filters').classList.toggle('open');
            t.setAttribute('aria-expanded', String(open));
          }
        });
        $('#scrim').addEventListener('click', () => closeDrawer());
        document.addEventListener('change', (e) => {
          if (e.target.id === 'open-only') state.open = e.target.checked;
          else if (e.target.id === 'group') state.group = e.target.value;
          else if (e.target.id === 'sort') state.sort = e.target.value;
          else return;
          render();
        });
        let typing;
        $('#q').addEventListener('input', (e) => {
          clearTimeout(typing);
          typing = setTimeout(() => {
            state.q = e.target.value.trim();
            render();
          }, 120);
        });
        function closeDrawer() {
          const id = state.item;
          state.item = null;
          render();
          document.querySelector(`[data-item="${id}"]`)?.focus();
        }
        document.addEventListener('keydown', (e) => {
          const inField = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
          if (e.key === 'Escape') {
            if (state.item) return closeDrawer();
            if (inField) e.target.blur();
            return;
          }
          if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
          if (e.key === '/') {
            e.preventDefault();
            $('#q').focus();
          } else if (state.item && (e.key === 'j' || e.key === 'k')) {
            const list = filtered();
            const idx = list.findIndex((i) => i.id === state.item);
            const target = idx < 0 ? null : list[idx + (e.key === 'j' ? 1 : -1)];
            if (target) {
              state.item = target.id;
              render();
            }
          }
        });
        window.addEventListener('hashchange', () => {
          readHash();
          render();
        });

        try {
          const saved = localStorage.getItem('solo-backlog-theme');
          if (saved) document.documentElement.dataset.theme = saved;
        } catch {
          /* ignore */
        }
        readHash();
        render();
      })();
    </script>
  </body>
</html>
