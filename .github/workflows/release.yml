name: Release

# Push a tag vX.Y.Z (matching package.json; set it with `npm run release:version -- X.Y.Z`):
#   1. checks versions, drafts a GitHub release with notes from the commits since the previous tag;
#   2. builds desktop installers for Linux (deb, rpm, AppImage), Windows (MSI, NSIS) and macOS (DMG);
#   3. publishes the release once everything succeeded.
#
# Code signing switches on when its secrets exist (installers are unsigned otherwise):
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (notarisation)
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD (PFX, base64)
# In-app updates (ADR 0015):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  sign the update packages and upload
#     latest.json to the release (the public key is in tauri.conf.json);
#   repository variable UPDATER_ENDPOINT  the public URL of latest.json the apps poll. Unset: apps built
#     by this run don't offer updates (Settings › Updates stays hidden).
# Running the workflow manually builds the installers as artifacts without releasing.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: meta
        name: Check versions
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; }
            for manifest in services/api/Cargo.toml services/local/Cargo.toml apps/client/src-tauri/Cargo.toml; do
              cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)
              [ "$cargo_version" = "$version" ] || { echo "::error::$manifest is $cargo_version, expected $version"; exit 1; }
            done
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          range=${previous:+$previous..}HEAD
          {
            echo "## Changes"
            git log --no-merges --pretty='- %s' "$range" | head -60
            echo
            echo "## Upgrading"
            echo "Install the new version over the old one (or use Settings › Updates). Your books are kept and updated when it starts."
          } > notes.md
      - id: release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" \
            -F draft=true -F body=@notes.md --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_targets: ''
          - name: Windows
            platform: windows-latest
            args: --bundles msi,nsis
            rust_targets: ''
          - name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
          key: ${{ matrix.platform }}
      - run: npm ci
      - name: Signing configuration (only when the secrets exist)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          # A missing secret still arrives as an empty variable, and Tauri then tries to sign with an
          # empty certificate. Export the signing variables only when they're set.
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!name}" ]; then
                delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}"
                { echo "$name<<$delimiter"; printf '%s\n' "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
              fi
            done
          fi
          if [ "$RUNNER_OS" = Windows ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "SIGN_WINDOWS=true" >> "$GITHUB_ENV"
          fi
      - name: Windows code signing certificate
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          $cert = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\cert.pfx" -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
          $conf | ConvertTo-Json -Depth 5 | Set-Content apps/client/src-tauri/tauri.signing.conf.json
      - name: Update packages and feed (only when the key and address are set)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
        run: |
          # Signed update packages need the updater key; without it the release still builds installers.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}"
              { echo "$name<<$delimiter"; printf '%s\n' "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
            done
            echo "UPDATER_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          fi
          # The feed the apps poll. Builds keep the address they were made with, so set it before
          # handing installers out.
          if [ -n "$UPDATER_ENDPOINT" ]; then
            printf '{"plugins":{"updater":{"endpoints":["%s"]}}}\n' "$UPDATER_ENDPOINT" > apps/client/src-tauri/tauri.endpoint.conf.json
            echo "ENDPOINT_CONFIG=--config src-tauri/tauri.endpoint.conf.json" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing variables come from the step above, only when the secrets exist.
        with:
          projectPath: apps/client
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json for the in-app updater, written only when update packages were signed.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.UPDATER_CONFIG }} ${{ env.ENDPOINT_CONFIG }} ${{ hashFiles('apps/client/src-tauri/tauri.signing.conf.json') != '' && '--config src-tauri/tauri.signing.conf.json' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/client/src-tauri/target/**/release/bundle/deb/*.deb
            apps/client/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/client/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/client/src-tauri/target/**/release/bundle/msi/*.msi
            apps/client/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/client/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: [prepare, desktop]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
