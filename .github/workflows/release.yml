name: Release

# Builds the desktop installers and publishes a GitHub release for tag vX.Y.Z. Normally called by
# release-please.yml when its release pull request is merged (it has already tagged the commit and
# drafted the release with the CHANGELOG.md section as notes); pushing a tag by hand works too.
#   1. checks the tag matches every version, finds (or drafts) the release;
#   2. builds desktop installers for Linux (deb, rpm, AppImage), Windows (MSI, NSIS) and macOS (DMG);
#   3. publishes the release once everything succeeded.
#
# Code signing switches on when its secrets exist (installers are unsigned otherwise):
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (notarisation)
#   Windows: WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD (PFX, base64)
# In-app updates (ADR 0015):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  sign the update packages and upload
#     latest.json to the release (the public key is in tauri.conf.json);
#   repository variable UPDATER_ENDPOINT  the public URL of latest.json the apps poll. Unset: apps built
#     by this run don't offer updates (Settings › Updates stays hidden).
# Running the workflow manually builds the installers as artifacts without releasing.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag, vX.Y.Z
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - id: meta
        name: Check versions
        env:
          CALLED_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          tag="$CALLED_TAG"
          if [ -z "$tag" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          if [ -n "$tag" ]; then
            [ "$tag" = "v$version" ] || { echo "::error::Tag $tag does not match package.json $version"; exit 1; }
            for manifest in services/api/Cargo.toml services/local/Cargo.toml apps/client/src-tauri/Cargo.toml; do
              cargo_version=$(grep -m1 "^version = " "$manifest" | cut -d'"' -f2)
              [ "$cargo_version" = "$version" ] || { echo "::error::$manifest is $cargo_version, expected $version"; exit 1; }
            done
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Release notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # This version's CHANGELOG.md section (written by release-please), else the commit subjects.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## [" v "]") == 1 || index($0, "## " v) == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            git log --no-merges --pretty='- %s' "${previous:+$previous..}HEAD" | head -60 > changes.md
          fi
          {
            cat changes.md
            echo
            echo "### Upgrading"
            echo "Install the new version over the old one, or use Settings › Updates in the app. Your books are kept and updated when it starts."
          } > notes.md
      - id: release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # release-please has usually drafted it already. Drafts aren't found by tag, and theirs carries a
          # placeholder tag ("untagged-…") until it's published, so match its name too.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq ".[] | select(.tag_name == \"$TAG\" or (.draft and .name == \"$TAG\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=true -F body=@notes.md > /dev/null
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" -F draft=true -F body=@notes.md --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_targets: ''
          - name: Windows
            platform: windows-latest
            args: --bundles msi,nsis
            rust_targets: ''
          - name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri
          key: ${{ matrix.platform }}
      - run: npm ci
      - name: Signing configuration (only when the secrets exist)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          # A missing secret still arrives as an empty variable, and Tauri then tries to sign with an
          # empty certificate. Export the signing variables only when they're set.
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_CERTIFICATE" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -n "${!name}" ]; then
                delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}"
                { echo "$name<<$delimiter"; printf '%s\n' "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
              fi
            done
          fi
          if [ "$RUNNER_OS" = Windows ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "SIGN_WINDOWS=true" >> "$GITHUB_ENV"
          fi
      - name: Windows code signing certificate
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
          $cert = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\cert.pfx" -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          $conf = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } }
          $conf | ConvertTo-Json -Depth 5 | Set-Content apps/client/src-tauri/tauri.signing.conf.json
      - name: Update packages and feed (only when the key and address are set)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_ENDPOINT: ${{ vars.UPDATER_ENDPOINT }}
        run: |
          # Signed update packages need the updater key; without it the release still builds installers.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
              delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}"
              { echo "$name<<$delimiter"; printf '%s\n' "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
            done
            echo "UPDATER_CONFIG=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_ENV"
          fi
          # The feed the apps poll. Builds keep the address they were made with, so set it before
          # handing installers out.
          if [ -n "$UPDATER_ENDPOINT" ]; then
            printf '{"plugins":{"updater":{"endpoints":["%s"]}}}\n' "$UPDATER_ENDPOINT" > apps/client/src-tauri/tauri.endpoint.conf.json
            echo "ENDPOINT_CONFIG=--config src-tauri/tauri.endpoint.conf.json" >> "$GITHUB_ENV"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing variables come from the step above, only when the secrets exist.
        with:
          projectPath: apps/client
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # latest.json for the in-app updater, written only when update packages were signed.
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ env.UPDATER_CONFIG }} ${{ env.ENDPOINT_CONFIG }} ${{ hashFiles('apps/client/src-tauri/tauri.signing.conf.json') != '' && '--config src-tauri/tauri.signing.conf.json' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            apps/client/src-tauri/target/**/release/bundle/deb/*.deb
            apps/client/src-tauri/target/**/release/bundle/rpm/*.rpm
            apps/client/src-tauri/target/**/release/bundle/appimage/*.AppImage
            apps/client/src-tauri/target/**/release/bundle/msi/*.msi
            apps/client/src-tauri/target/**/release/bundle/nsis/*.exe
            apps/client/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    needs: [prepare, desktop]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        # By ID, attaching the real tag: a release-please draft still has a placeholder tag.
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -F draft=false -f make_latest=true --jq '.html_url'
